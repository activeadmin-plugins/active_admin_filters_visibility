name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / AA ${{ matrix.activeadmin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ruby 3.3 is the floor: 3.1 (eol 2025-03-26) and 3.2 (eol 2026-03-31)
        # are both out of support.
        ruby: ['3.3', '3.4', '4.0']
        # Rails 7.2 went eol 2026-08-09; 8.2 is not released yet.
        rails: ['8.0.0', '8.1.0']
        # Every activeadmin 3.2+ resolves and passes against Rails 8.0 and 8.1,
        # so no exclude rules are needed.
        activeadmin: ['3.2.0', '3.3.0', '3.4.0', '3.5.0']
    env:
      RAILS: ${{ matrix.rails }}
      AA: ${{ matrix.activeadmin }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rspec spec
